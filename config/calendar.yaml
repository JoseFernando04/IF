# Frecuencia y horarios (hora de Guatemala). Se ajustan con métricas en la Fase 4.
timezone: America/Guatemala
pieces_per_week: 4
slots:
  - {day: martes, time: "12:30", format: reel}
  - {day: miercoles, time: "18:30", format: carousel}
  - {day: jueves, time: "12:30", format: reel}
