# Motores de cada módulo. Cambiá un valor para reemplazar un módulo sin tocar el resto.
engines:
  copy: ollama          # ollama | file (copy escrito a mano o por Claude vía MCP)
  graphics: playwright
  video: html_frames
  tts: chatterbox       # azure | google (nube, capa gratis) | chatterbox | kokoro (locales) | none (solo música)
  music: library
  publisher: dry_run    # dry_run | instagram | tiktok_inbox | manual_email (Fases 3+)

copy:
  ollama_model: qwen3:8b
  temperature: 0.7

reel:
  width: 1080
  height: 1920
  fps: 30
  min_seconds: 15
  max_seconds: 60
  scene_padding_s: 0.45     # silencio entre escenas
  min_scene_s: 2.2
  progress_bar: false       # barra superior que muestra el avance del reel
  captions: false           # subtítulos de la voz en off

carousel:
  width: 1080
  height: 1350
  min_slides: 3
  max_slides: 10

tts:
  azure:
    voice: es-GT-MartaNeural     # mujer, Guatemala. Otras: es-MX-DaliaNeural, es-CO-SalomeNeural
    rate: "0%"
  google:
    voice: es-US-Chirp3-HD-Aoede # mujer, español latino. Otras: -Kore, -Leda, -Zephyr
    speaking_rate: 1.0
  chatterbox:
    python: .venv-tts/Scripts/python.exe
    reference: assets/voice/referencia.wav   # 10-20 s de una voz real (con permiso). Si no existe, usa la voz por defecto.
    exaggeration: 0.5       # expresividad: 0.3 sobria … 0.8 muy expresiva
    cfg_weight: 0.5         # menor = ritmo más pausado
    limpiar_salida: true    # pasa cada frase generada por DeepFilterNet (menos ruido de fondo)
  kokoro:
    voice: em_alex          # em_alex (masculina) | ef_dora (femenina)
    speed: 1.05
    model_dir: models/kokoro

music:
  library: assets/music/library.yaml
  volume_db: -12            # volumen base de la música bajo la voz
  duck_threshold: 0.06      # a partir de qué nivel de voz baja la música
  duck_ratio: 2.5           # cuánto baja (más alto = la música se apaga más al hablar)
  volume_no_voice_db: -12

# Video con IA (de pago por generación). Solo imagen de apoyo: la voz sigue siendo la del equipo.
higgsfield:
  modelo: bytedance/seedance-2.5/text-to-video
  resolucion: 720p          # 480p | 720p | 1080p (más resolución = más créditos)
  aspecto: "9:16"
  duracion: 5               # segundos por toma (4 a 30)
  audio: false              # el sonido lo ponemos nosotros (voz, música, efectos)
  max_tomas_por_reel: 5     # tope para no gastar de más
  # USD por segundo (open.higgsfield.ai, revisado 2026-11-10). Solo para estimar antes de generar.
  usd_por_segundo:
    bytedance/seedance-2.5/text-to-video: {480p: 0.1177, 720p: 0.2647, 1080p: 0.6518}
    xai/grok-imagine-video/v1.5/reference-to-video: {480p: 0.08, 720p: 0.14, 1080p: 0.25}   # máx. 15 s por toma
  max_usd_por_corrida: 7.0  # si el plan cuesta más que esto, no se lanza
  # Se agrega al final de cada prompt para que todas las tomas se vean de la misma marca.
  estilo: >-
    Cinematic documentary realism, shot on 35mm, shallow depth of field, slow deliberate camera move.
    Warm golden light, dark forest-green tones in walls and shadows, ivory highlights, well exposed (not underexposed).
    Small humble family-run business in Guatemala, modest scale, never a large industrial facility.
    People seen only from behind, in silhouette or hands only. No readable text, no logos, no subtitles, no watermark.

limits:
  caption_max_chars: 2200
  hashtags_max: 5

paths:
  output: data/output
  database: data/ifcontent.db
