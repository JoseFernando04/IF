<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face { font-family: "SG"; src: url("__FONTS__/SpaceGrotesk.ttf"); font-weight: 300 700; }
@font-face { font-family: "Tight"; src: url("__FONTS__/InterTight.ttf"); font-weight: 100 900; }
@font-face { font-family: "Mono"; src: url("__FONTS__/JetBrainsMono.ttf"); }
@font-face { font-family: "Serif"; src: url("__FONTS__/InstrumentSerif-Italic.ttf"); }
/* Formato «Lista sin intro»: el #1 en el segundo 0, una imagen de referencia por punto. */
:root { --bg: #0a1410; --sf: #162920; --sf2: #1d362b; --au: #f0c419; --tx: #fefcf3; --mu: #9ca3af; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--tx); font-family: "Tight"; }
#fondo { position: absolute; inset: 0; }
#rotulo { position: absolute; left: 80px; right: 80px; top: 110px; font: 500 26px "Mono"; letter-spacing: 2px; color: var(--au); text-transform: uppercase; white-space: nowrap; }
#barra { position: absolute; left: 80px; top: 165px; height: 6px; width: 920px; background: rgba(254,252,243,.12); }
#barra i { display: block; height: 100%; background: var(--au); transform-origin: 0 50%; }
#numcaja { position: absolute; left: 50px; top: 200px; width: 700px; height: 560px; overflow: hidden; }
#num { position: absolute; left: 0; top: 0; font: 700 560px/1 "SG"; color: var(--au); }
#tit { position: absolute; left: 80px; right: 80px; top: 770px; font: 700 110px/1.02 "SG"; letter-spacing: -2px; }
#tit .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 8px; margin-bottom: -8px; }
#tit .w span { display: inline-block; }
#ref { position: absolute; left: 80px; right: 80px; top: 1090px; height: 620px; border-radius: 40px; background: var(--sf); padding: 56px; box-sizing: border-box; overflow: hidden; }
.mono { font: 500 30px "Mono"; color: var(--mu); letter-spacing: 1px; }
.big { font: 600 60px "SG"; }
.star { display: inline-block; font-size: 90px; color: var(--au); margin-right: 6px; }
.bub { display: inline-block; padding: 28px 36px; border-radius: 30px; background: var(--sf2); font-size: 50px; }
.bub.me { background: #2b4a3a; }
.bub .h { font: 500 28px "Mono"; color: var(--mu); margin-left: 12px; }
#spin { width: 150px; height: 150px; border-radius: 50%; border: 16px solid var(--sf2); border-top-color: var(--au); box-sizing: border-box; }
#res { position: absolute; left: 80px; right: 80px; top: 520px; }
#res h2 { margin: 0 0 90px; font: 400 130px/1 "Serif"; color: var(--au); font-weight: 400; }
#res .it { display: flex; align-items: center; gap: 36px; font: 700 92px/1 "SG"; margin-bottom: 70px; }
#res .ck { width: 110px; height: 110px; border-radius: 26px; background: var(--au); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 76px; flex: none; }
#cierre { position: absolute; left: 80px; right: 80px; top: 640px; }
#cierre h1 { margin: 0; font: 700 128px/1 "SG"; letter-spacing: -3px; }
#cierre h1 em { font: 400 150px/1 "Serif"; color: var(--au); font-style: normal; }
#wa { display: inline-block; margin-top: 90px; padding: 30px 44px; border-radius: 999px; background: var(--au); color: var(--bg); font: 700 54px "SG"; }
#logo { position: absolute; right: 80px; bottom: 90px; height: 80px; }
</style></head>
<body>
<div id="fondo"></div>
<div id="rotulo"></div>
<div id="barra"><i></i></div>
<div id="numcaja"><div id="num"></div></div>
<div id="tit"></div>
<div id="ref"></div>
<div id="res"></div>
<div id="cierre"><h1 id="ctit"></h1><div id="wa"></div></div>
<img id="logo" src="__LOGO__">
<script type="module">
import { fondo } from "__SHARED__/fondos.js";
const REEL = __DATOS__;
window.__ready = false;
const L = REEL.lineas, $ = (id) => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const out = (x) => 1 - (1 - cl(x)) ** 3;
const pop = (x) => { x = cl(x); return x === 0 ? 0 : 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2; };
const fondoP = fondo($("fondo"), "grano", { back: "#0a1410", colors: ["#1d362b", "#3a3412", "#0f1d17"], softness: 0.8, intensity: 0.25, noise: 0.18, shape: "corners" });
const lineaEn = (t) => { let k = 0; L.forEach((l, i) => { if (t >= l.inicio - 0.05) k = i; }); return k; };
const puntos = L.filter((l) => l.punto).length;
$("rotulo").textContent = REEL.rotulo || "";
$("wa").textContent = "WhatsApp " + REEL.whatsapp;

function refHTML(r) {
  if (r.tipo === "resenas") return `<div class="mono">PERFIL DEL NEGOCIO · EJEMPLO</div>
    <div class="big" style="margin-top:30px">Tu negocio</div>
    <div style="margin-top:24px">${[1,2,3,4,5].map((k) => `<span class="star" data-k="${k}">${k <= r.estrellas ? "★" : "☆"}</span>`).join("")}
    <span style="font:500 44px Mono;margin-left:16px">${r.cuantas}</span></div>
    <div class="bub" id="ult" style="margin-top:50px;font-size:44px">${r.ultima}<br><span class="mono" style="color:#e57373">${r.hace}</span></div>`;
  if (r.tipo === "cargando") return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px">
    <div id="spin"></div><div class="big">Cargando…</div><div class="mono" id="cnota">${r.nota}</div></div>`;
  if (r.tipo === "chat") return `<div class="bub" id="q">${r.pregunta}<span class="h">${r.hora}</span></div>
    <div class="mono" id="sin" style="margin:70px 0;text-align:center">· · · sin respuesta · · ·</div>
    <div style="text-align:right"><div class="bub me" id="a">${r.respuesta}<span class="h" style="color:#e57373">${r.hora_r}</span></div></div>`;
  return "";
}
let armada = -1;
function armar(l) {
  $("num").textContent = l.punto ?? "";
  $("tit").innerHTML = (l.titulo || "").split("<br>").map((ln) => ln.split(" ").map((w) => `<span class="w"><span>${w}</span></span>`).join(" ")).join("<br>");
  $("ref").innerHTML = l.ref ? refHTML(l.ref) : "";
  $("res").innerHTML = (l.encabezado ? `<h2>${l.encabezado}</h2>` : "") + (l.items || []).map((x) => `<div class="it"><div class="ck">✓</div><div>${x}</div></div>`).join("");
  $("ctit").innerHTML = l.titulo || "";
}
function dibujar(t) {
  const i = lineaEn(t), l = L[i], dt = t - l.inicio, p = cl(dt / l.duracion);
  fondoP.then((f) => f.frame(t * 1000));
  if (armada !== i) { armar(l); armada = i; }
  const esPunto = !!l.punto, esRes = l.pantalla === "resumen", esCierre = l.pantalla === "cierre";
  ["numcaja", "tit", "ref"].forEach((id) => ($(id).style.display = esPunto ? "block" : "none"));
  $("res").style.display = esRes ? "block" : "none";
  $("cierre").style.display = esCierre ? "block" : "none";
  $("logo").style.opacity = esCierre ? 1 : 0.0;
  $("rotulo").style.opacity = esCierre ? 0 : 1;
  // Barra de progreso de la lista
  const hechos = esPunto ? (l.punto - 1 + p) / puntos : 1;
  $("barra").querySelector("i").style.transform = `scaleX(${hechos})`;
  $("barra").style.opacity = esCierre ? 0 : 1;
  if (esPunto) {
    // El número entra de golpe (en el segundo 0 ya está ahí en el primer punto)
    const e = i === 0 ? 1 : out(dt / 0.35), ini = i === 0 ? 1 : 0;
    $("num").style.transform = `translateY(${(1 - e) * 560}px)`;
    [...$("tit").querySelectorAll(".w span")].forEach((s, j) => {
      s.style.transform = `translateY(${(1 - Math.max(ini, out((dt - 0.1 - j * 0.06) / 0.35))) * 110}%)`; });
    const r = out((dt - 0.25) / 0.45);
    $("ref").style.transform = `translateY(${(1 - r) * 140}px)`; $("ref").style.opacity = r;
    const tipo = l.ref?.tipo;
    if (tipo === "resenas") {
      document.querySelectorAll(".star").forEach((s) => { const k = +s.dataset.k; s.style.transform = `scale(${pop((dt - 0.5 - k * 0.1) / 0.3)})`; });
      const u = $("ult"); u.style.transform = `scale(${pop((dt - 1.4) / 0.35)})`;
    }
    if (tipo === "cargando") { $("spin").style.transform = `rotate(${t * 400}deg)`; $("cnota").style.opacity = cl((dt - 1.4) / 0.3); }
    if (tipo === "chat") {
      $("q").style.transform = `scale(${pop((dt - 0.45) / 0.3)})`;
      $("sin").style.opacity = cl((dt - 1.2) / 0.3) * (0.5 + 0.5 * Math.abs(Math.sin(t * 3)));
      $("a").style.transform = `scale(${pop((p - 0.62) / 0.08)})`;
    }
  }
  if (esRes) [...$("res").querySelectorAll(".it")].forEach((it, j) => {
    const a = out((p - 0.12 - j * 0.24) / 0.12); it.style.opacity = a; it.style.transform = `translateX(${(1 - a) * -80}px)`; });
  if (esCierre) {
    const a = out(dt / 0.45); $("ctit").style.opacity = a; $("ctit").style.transform = `translateY(${(1 - a) * 60}px)`;
    $("wa").style.transform = `scale(${pop((dt - 0.5) / 0.35)})`;
  }
}
await fondoP;
await document.fonts.ready;
window.__seek = async (t) => { dibujar(t); await fondoP; };
window.__ready = true;
</script>
</body></html>
