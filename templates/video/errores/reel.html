<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face { font-family: "SG"; src: url("__FONTS__/SpaceGrotesk.ttf"); font-weight: 300 700; }
@font-face { font-family: "Tight"; src: url("__FONTS__/InterTight.ttf"); font-weight: 100 900; }
@font-face { font-family: "Mono"; src: url("__FONTS__/JetBrainsMono.ttf"); }
@font-face { font-family: "Serif"; src: url("__FONTS__/InstrumentSerif-Italic.ttf"); }
/* Formato «Encontrá los 3 errores»: juego de buscar fallas en una pantalla (perfil de negocio genérico, sin logos).
   Gancho → cuenta regresiva → cada error se encierra en rojo → versión arreglada → cierre. */
:root { --bg: #0a1410; --sf: #162920; --au: #f0c419; --tx: #fefcf3; --mu: #9ca3af; --rojo: #e8412c; --ok: #3fbf74; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--tx); font-family: "Tight"; }
#fondo { position: absolute; inset: 0; }
#rotulo { position: absolute; left: 80px; top: 100px; font: 700 64px/1 "SG"; letter-spacing: -1px; }
#rotulo em { font: 400 74px "Serif"; color: var(--au); font-style: normal; }
#marcador { position: absolute; right: 80px; top: 92px; display: flex; gap: 16px; }
#marcador i { width: 64px; height: 64px; border-radius: 50%; border: 5px solid rgba(254,252,243,.25); box-sizing: border-box;
  display: flex; align-items: center; justify-content: center; font: 700 34px "SG"; font-style: normal; color: transparent; }
#marcador i.si { background: var(--rojo); border-color: var(--rojo); color: #fff; }
#marcador i.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
/* Teléfono */
#tel { position: absolute; left: 170px; top: 230px; width: 740px; height: 1340px; border-radius: 80px; background: #050a08; padding: 22px; box-sizing: border-box;
  box-shadow: 0 50px 120px rgba(0,0,0,.55), inset 0 0 0 3px #26332c; transform-origin: 50% 40%; }
#pant { position: relative; width: 100%; height: 100%; border-radius: 60px; background: #fbfaf5; overflow: hidden; color: #15201a; }
.barra-sup { height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 50px; font: 600 26px "Tight"; }
.cab { display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 32px "Tight"; padding: 6px 0 20px; }
.perfil { display: flex; align-items: center; gap: 34px; padding: 10px 40px 0; }
.av { width: 150px; height: 150px; border-radius: 50%; background: var(--sf); color: var(--au); display: flex; align-items: center; justify-content: center;
  font: 700 54px "SG"; flex: none; box-shadow: 0 0 0 6px #fbfaf5, 0 0 0 10px #d9d3bf; }
.datos { display: flex; gap: 30px; text-align: center; font: 400 22px "Tight"; color: #5b5f57; }
.datos b { display: block; font: 700 34px "Tight"; color: #15201a; }
.nom { padding: 22px 40px 0; font: 700 30px "Tight"; }
#bio { margin: 8px 30px 0; padding: 8px 10px; font: 400 28px/1.35 "Tight"; color: #2a302c; min-height: 80px; }
#contacto { display: flex; gap: 14px; margin: 18px 40px 0; }
#contacto div { flex: 1; height: 66px; border-radius: 16px; background: #ebe6d8; display: flex; align-items: center; justify-content: center; font: 700 26px "Tight"; }
#contacto .wa { background: #25a35a; color: #fff; }
.dest { display: flex; gap: 22px; padding: 26px 40px 0; }
.dest div { width: 96px; height: 96px; border-radius: 50%; border: 3px solid #d9d3bf; background: #ebe6d8; }
#grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 30px; }
#grid > div { aspect-ratio: 1; position: relative; display: flex; align-items: center; justify-content: center; text-align: center;
  font: 700 30px/1.05 "SG"; color: #fefcf3; padding: 12px; box-sizing: border-box; }
#grid .fecha { position: absolute; left: 10px; bottom: 10px; font: 600 20px "Mono"; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 6px; }
/* Círculos rojos a mano */
#trazos { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
#trazos path { fill: none; stroke: var(--rojo); stroke-width: 11; stroke-linecap: round; }
#trazos path.ok { stroke: var(--ok); }
.ficha { position: absolute; width: 86px; height: 86px; border-radius: 50%; background: var(--rojo); color: #fff; font: 700 50px "SG";
  display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.ficha.ok { background: var(--ok); }
/* Rótulo inferior */
#nota { position: absolute; left: 80px; right: 80px; top: 1640px; text-align: center; font: 700 64px/1.08 "SG"; letter-spacing: -1px; }
#nota em { font: 400 74px "Serif"; color: var(--au); font-style: normal; }
/* Cuenta regresiva */
#reloj { position: absolute; left: 340px; top: 600px; width: 400px; height: 400px; }
#reloj svg { position: absolute; inset: 0; transform: rotate(-90deg); }
#reloj circle { fill: rgba(10,20,16,.88); stroke: var(--au); stroke-width: 22; }
#reloj div { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 220px "SG"; color: var(--au); }
#cierre { position: absolute; left: 80px; right: 80px; top: 620px; }
#cierre h1 { margin: 0; font: 700 128px/1 "SG"; letter-spacing: -3px; }
#cierre h1 em { font: 400 150px/1 "Serif"; color: var(--au); font-style: normal; }
#wa { display: inline-block; margin-top: 90px; padding: 30px 44px; border-radius: 999px; background: var(--au); color: var(--bg); font: 700 54px "SG"; }
#logo { position: absolute; right: 80px; bottom: 90px; height: 80px; }
</style></head>
<body>
<div id="fondo"></div>
<div id="rotulo"></div>
<div id="marcador"><i>1</i><i>2</i><i>3</i></div>
<div id="tel"><div id="pant">
  <div class="barra-sup"><span>9:41</span><span>▮▮▮ ▰</span></div>
  <div class="cab" id="usuario"></div>
  <div class="perfil"><div class="av" id="av"></div>
    <div class="datos"><div><b id="npub"></b>publicaciones</div><div><b>·</b>seguidores</div><div><b>·</b>seguidos</div></div></div>
  <div class="nom" id="nombre"></div>
  <div id="bio"></div>
  <div id="contacto"></div>
  <div class="dest"><div></div><div></div><div></div><div></div></div>
  <div id="grid"></div>
</div></div>
<svg id="trazos" viewBox="0 0 1080 1920"></svg>
<div id="fichas"></div>
<div id="reloj"><svg viewBox="0 0 400 400"><circle cx="200" cy="200" r="180" pathLength="1" id="aro"></circle></svg><div id="seg"></div></div>
<div id="nota"></div>
<div id="cierre"><h1 id="ctit"></h1><div id="wa"></div></div>
<img id="logo" src="__LOGO__">
<script type="module">
import { fondo } from "__SHARED__/fondos.js";
const REEL = __DATOS__;
window.__ready = false;
const L = REEL.lineas, P = REEL.perfil, $ = (id) => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const out = (x) => 1 - (1 - cl(x)) ** 3;
const pop = (x) => { x = cl(x); return x === 0 ? 0 : 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2; };
const fondoP = fondo($("fondo"), "grano", { back: "#0a1410", colors: ["#1d362b", "#3a3412", "#0f1d17"], softness: 0.8, intensity: 0.25, noise: 0.18, shape: "corners" });
const lineaEn = (t) => { let k = 0; L.forEach((l, i) => { if (t >= l.inicio - 0.05) k = i; }); return k; };
$("rotulo").innerHTML = REEL.rotulo || "Encontrá los <em>3 errores</em>";
$("wa").textContent = "WhatsApp " + REEL.whatsapp;
$("usuario").textContent = P.usuario;
$("av").textContent = P.iniciales;
$("nombre").textContent = P.nombre;
$("npub").textContent = P.publicaciones ?? "·";
const COLORES = ["#2f5d46", "#7a5530", "#1d362b", "#b98a52", "#3b3a10", "#2f5d46", "#5b4a2a", "#1d362b", "#7a5530"];

// Estado del perfil: «mal» (con errores) o «bien» (arreglado)
let estado = null;
function perfil(bien) {
  if (estado === bien) return; estado = bien;
  $("bio").innerHTML = bien ? P.bio_bien : P.bio_mal;
  $("contacto").innerHTML = bien ? `<div class="wa">WhatsApp</div><div>${P.boton_bien || "Catálogo"}</div>` : `<div>Seguir</div><div>Compartir</div>`;
  const tiles = bien ? P.tiles_bien : P.tiles_mal;
  $("grid").innerHTML = tiles.map((x, k) => `<div style="background:${COLORES[k % COLORES.length]}${!bien ? ";filter:saturate(.35) brightness(.9)" : ""}">${x}
    ${k === 0 ? `<span class="fecha" id="fecha">${bien ? P.fecha_bien : P.fecha_mal}</span>` : ""}</div>`).join("");
}
// Caja (en coordenadas de la página) de cada zona que puede tener un error
const zona = (z) => { const e = { bio: $("bio"), contacto: $("contacto"), fecha: $("grid").firstElementChild }[z]; return e.getBoundingClientRect(); };
// Óvalo a mano alrededor de una caja (un poco más de una vuelta, con temblor fijo)
function ovalo(r, semilla) {
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2, rx = r.width / 2 + 30, ry = r.height / 2 + 18;
  let d = ""; const n = 46;
  for (let k = 0; k <= n; k++) {
    const a = -2.2 + (k / n) * Math.PI * 2.25, w = 1 + 0.035 * Math.sin(k * 1.7 + semilla) + 0.05 * (k / n);
    d += (k ? "L" : "M") + (cx + Math.cos(a) * rx * w).toFixed(1) + " " + (cy + Math.sin(a) * ry * w).toFixed(1);
  }
  return d;
}
const ERRORES = L.filter((l) => l.error).map((l) => l.error);
let marcas = null;
function armarMarcas() {
  perfil(false);
  marcas = ERRORES.map((z, k) => { const r = zona(z); return { z, r, d: ovalo(r, k * 2.3) }; });
  $("trazos").innerHTML = marcas.map((m, k) => `<path d="${m.d}" pathLength="1" id="tr${k}"></path>`).join("");
  $("fichas").innerHTML = marcas.map((m, k) => `<div class="ficha" id="fi${k}" style="left:${m.r.right + 6}px;top:${m.r.top - 64}px">${k + 1}</div>`).join("");
}
function dibujar(t) {
  const i = lineaEn(t), l = L[i], dt = t - l.inicio, p = cl(dt / l.duracion);
  fondoP.then((f) => f.frame(t * 1000));
  const esc = l.escena, cierre = esc === "cierre", arreglo = esc === "arreglo";
  if (!marcas) armarMarcas();
  perfil(arreglo || cierre);
  // Cuántos errores ya se marcaron (hasta esta línea)
  const nErr = L.slice(0, i + 1).filter((x) => x.error).length;
  ["tel", "trazos", "fichas", "marcador", "rotulo"].forEach((id) => ($(id).style.opacity = cierre ? 0 : 1));
  $("cierre").style.display = cierre ? "block" : "none";
  $("logo").style.opacity = cierre ? 1 : 0;
  // Entrada del teléfono
  const e = out(t / 0.5);
  $("tel").style.transform = `translateY(${(1 - e) * 200}px) scale(${0.96 + 0.04 * e})`;
  // Marcador 1-2-3
  [...$("marcador").children].forEach((c, k) => { c.className = arreglo ? "ok" : k < nErr ? "si" : "";
    c.style.transform = `scale(${k === nErr - 1 && l.error ? pop((dt - 0.6) / 0.3) : 1})`; });
  // Trazos rojos
  marcas.forEach((m, k) => {
    const path = $("tr" + k), fi = $("fi" + k), idx = L.findIndex((x) => x.error === m.z);
    const a = i > idx ? 1 : i === idx ? out((dt - 0.15) / 0.55) : 0;
    path.style.strokeDasharray = "1 1"; path.style.strokeDashoffset = 1 - a;
    path.setAttribute("class", arreglo ? "ok" : "");
    fi.className = "ficha" + (arreglo ? " ok" : ""); fi.textContent = arreglo ? "✓" : k + 1;
    fi.style.transform = `scale(${i > idx ? 1 : i === idx ? pop((dt - 0.55) / 0.3) : 0})`;
    path.style.opacity = arreglo ? 1 - cl((p - 0.8) / 0.2) : 1; fi.style.opacity = path.style.opacity;
  });
  // Cuenta regresiva
  const cuenta = esc === "cuenta";
  $("reloj").style.display = cuenta ? "block" : "none";
  if (cuenta) { const n = REEL.segundos || 5, q = cl((dt - 0.2) / Math.max(0.5, l.duracion - 0.2));
    $("seg").textContent = Math.max(1, Math.ceil(n * (1 - q)));
    $("aro").style.strokeDasharray = "1 1"; $("aro").style.strokeDashoffset = q;
    $("reloj").style.transform = `scale(${pop(dt / 0.3)})`; }
  // Nota inferior
  const nota = l.nota || "";
  if ($("nota").dataset.v !== nota) { $("nota").innerHTML = nota; $("nota").dataset.v = nota; }
  const nA = out((dt - 0.3) / 0.35);
  $("nota").style.opacity = cierre ? 0 : nA; $("nota").style.transform = `translateY(${(1 - nA) * 40}px)`;
  if (cierre) { $("ctit").innerHTML = l.titulo; const a = out(dt / 0.45);
    $("ctit").style.opacity = a; $("ctit").style.transform = `translateY(${(1 - a) * 60}px)`;
    $("wa").style.transform = `scale(${pop((dt - 0.5) / 0.35)})`; }
}
await fondoP;
await document.fonts.ready;
window.__seek = async (t) => { dibujar(t); await fondoP; };
window.__ready = true;
</script>
</body></html>
