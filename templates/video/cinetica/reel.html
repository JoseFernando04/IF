<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Bricolage"; src: url("__FONTS__/BricolageGrotesque.ttf"); font-weight: 200 800; }
@font-face { font-family: "SerifI"; src: url("__FONTS__/InstrumentSerif-Italic.ttf"); }
@font-face { font-family: "Mono"; src: url("__FONTS__/JetBrainsMono.ttf"); }
/* Tipografía cinética: pocas palabras clave, enormes, entrando al ritmo de la voz. *palabra* = acento en serif cursiva. */
:root { --verde: #0a1410; --oro: #f0c419; --marfil: #fefcf3; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--verde); }
#campo { position: absolute; inset: 0; }
#textura { position: absolute; inset: 0; mix-blend-mode: soft-light; opacity: .5; }
#bloque { position: absolute; left: 80px; right: 80px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; transform-origin: 30% 50%; }
.ren { display: block; }
.w { display: inline-block; font: 800 168px/0.95 "Bricolage"; letter-spacing: -7px; margin-right: 36px; transform-origin: 50% 80%; }
.w.acento { font: 400 196px/0.9 "SerifI"; letter-spacing: -3px; }
#sub { position: absolute; left: 80px; top: 1460px; font: 600 38px "Mono"; letter-spacing: 3px; }
#marca { position: absolute; left: 80px; top: 160px; font: 700 30px "Mono"; letter-spacing: 4px; }
#wa { position: absolute; left: 80px; top: 1440px; padding: 26px 46px; border-radius: 60px; background: var(--oro); color: var(--verde); font: 800 52px "Bricolage"; }
#logo { position: absolute; right: 80px; top: 1450px; width: 220px; }
</style></head>
<body>
<div id="campo"></div><div id="textura"></div>
<div id="marca">IF TECHWORKS · CON PROPÓSITO</div>
<div id="bloque"></div>
<div id="sub"></div>
<div id="wa"></div><img id="logo" src="__LOGO__">
<script type="module">
import { fondo } from "__SHARED__/fondos.js";
const R = __DATOS__;
document.getElementById("marca").textContent = "IF TECHWORKS · " + (R.etiqueta || "CON PROPÓSITO");
window.__ready = false;
const L = R.lineas;
const $ = (id) => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = (x) => 1 - Math.pow(1 - cl(x), 3);
const back = (x) => { x = cl(x); const s = 2.2; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const fondoP = fondo($("textura"), "trama", { back: "#000000", front: "#ffffff", shape: "simplex", type: "8x8", px: 3 });
const TEMAS = { verde: ["#0a1410", "#fefcf3", "#f0c419"], marfil: ["#fefcf3", "#0a1410", "#2f6b4c"], oro: ["#f0c419", "#0a1410", "#0a1410"] };
const lineaEn = (t) => { let k = 0; L.forEach((l, i) => { if (t >= l.inicio - 0.05) k = i; }); return k; };
// Cada línea: renglones separados por "/" y palabras; las palabras entran repartidas en el 75 % de la línea.
L.forEach((l) => {
  l.renglones = l.palabras.split("/").map((r) => r.trim().split(/\s+/));
  const n = l.renglones.flat().length; let k = 0;
  l.tiempos = l.renglones.map((r) => r.map(() => l.inicio + (k++ / Math.max(1, n)) * l.duracion * 0.75));
});
let armada = -1;
function dibujar(t) {
  const i = lineaEn(t), l = L[i], dt = t - l.inicio;
  fondoP.then((f) => f.frame(t * 1000 * 0.6));
  const [bg, fg, ac] = TEMAS[l.tema || "verde"];
  // Cambio de color: barrido desde abajo
  const pr = i ? TEMAS[L[i - 1].tema || "verde"][0] : bg, k = eo(dt / 0.3);
  $("campo").style.background = `linear-gradient(to top, ${bg} ${k * 100}%, ${pr} ${k * 100}%)`;
  $("marca").style.color = fg; $("sub").style.color = fg;
  if (armada !== i) {
    // El acento *…* puede abarcar varias palabras y renglones.
    let dentro = false;
    $("bloque").innerHTML = l.renglones.map((r) => `<div class="ren">${r.map((w) => {
      if (w.startsWith("*")) dentro = true;
      const a = dentro; if (/\*[.,?!]?$/.test(w)) dentro = false;
      return `<span class="w${a ? " acento" : ""}">${w.replace(/\*/g, "")}</span>`; }).join("")}</div>`).join("");
    armada = i;
  }
  const ws = [...$("bloque").querySelectorAll(".w")], ts = l.tiempos.flat();
  ws.forEach((w, j) => { const x = (t - ts[j]) / 0.28;
    w.style.color = w.classList.contains("acento") ? ac : fg;
    w.style.opacity = x > 0 ? 1 : 0; w.style.transform = `translateY(${(1 - eo(x)) * 70}px) scale(${0.6 + 0.4 * cl(back(x), 0, 1.3)})`; });
  $("bloque").style.transform = `scale(${1 + 0.04 * cl(dt / l.duracion)})`;
  $("sub").textContent = l.sub || ""; $("sub").style.opacity = eo((dt - l.duracion * 0.6) / 0.3);
  const ci = l.escena === "cierre";
  $("wa").style.display = ci ? "block" : "none"; $("wa").textContent = R.whatsapp;
  $("wa").style.transform = `scale(${0.8 + 0.2 * back((dt - l.duracion * 0.5) / 0.35)})`;
  $("logo").style.opacity = ci ? eo((dt - 0.3) / 0.4) : 0;
}
await fondoP;
await document.fonts.ready;
window.__seek = async (t) => { dibujar(t); await fondoP; };
window.__ready = true;
</script>
</body></html>
