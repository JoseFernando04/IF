<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Bricolage"; src: url("__FONTS__/BricolageGrotesque.ttf"); font-weight: 200 800; }
@font-face { font-family: "Serif"; src: url("__FONTS__/InstrumentSerif-Italic.ttf"); }
@font-face { font-family: "Mono"; src: url("__FONTS__/JetBrainsMono.ttf"); }
/* Look risográfico: dos tintas (verde y dorado) sobre papel tibio, desfase de registro y semitono. */
:root { --papel: #f4eee2; --verde: #1d4a35; --oro: #f0c419; --tinta: #0a1410; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--papel); font-family: "Bricolage"; }
#fondo { position: absolute; inset: 0; opacity: .9; }
.riso { color: var(--verde); text-shadow: 7px 4px 0 rgba(240,196,25,.9); }
.riso-oro { color: var(--tinta); text-shadow: -6px 3px 0 rgba(29,74,53,.35); }
#cab { position: absolute; top: 150px; left: 80px; right: 80px; display: flex; justify-content: space-between; font: 700 34px "Mono"; color: var(--verde); letter-spacing: 3px; }
#escena { position: absolute; left: 0; right: 0; top: 270px; height: 1250px; perspective: 2600px; }
#carta { position: absolute; left: 100px; width: 880px; top: 40px; height: 1120px; transform-style: preserve-3d; }
.cara { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 26px; overflow: hidden; padding: 90px 80px; box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: space-between; }
.frente { background: var(--papel); border: 6px solid var(--verde); box-shadow: 14px 14px 0 var(--verde); }
.dorso { background: var(--oro); transform: rotateY(180deg); border: 6px solid var(--tinta); box-shadow: -14px 14px 0 var(--tinta); }
.semitono { position: absolute; inset: -40px; pointer-events: none; mix-blend-mode: multiply; transform: rotate(15deg);
  background-image: radial-gradient(circle, rgba(29,74,53,.22) 34%, transparent 37%); background-size: 22px 22px;
  -webkit-mask-image: linear-gradient(160deg, transparent 35%, #000 90%); }
.dorso .semitono { background-image: radial-gradient(circle, rgba(10,20,16,.16) 34%, transparent 37%);
  -webkit-mask-image: linear-gradient(20deg, #000 10%, transparent 60%); }
.sello { font: 800 200px/0.9 "Bricolage"; letter-spacing: -8px; transform-origin: 20% 60%; position: relative; }
.num { font: 700 36px "Mono"; letter-spacing: 4px; position: relative; }
.frase { font: 800 112px/0.98 "Bricolage"; letter-spacing: -3px; position: relative; }
.frente .frase { color: var(--tinta); }
.dorso .sello { font-size: 150px; letter-spacing: -5px; }
.tacha { position: absolute; left: -20px; top: 0; height: 30px; background: #d6432f; mix-blend-mode: multiply; transform-origin: 0 50%; border-radius: 6px; }
/* Título y cierre */
.panel { position: absolute; left: 80px; right: 80px; top: 360px; opacity: 0; }
.panel .grande { font: 800 290px/0.86 "Bricolage"; letter-spacing: -10px; }
.panel .serif { font: 400 140px/1 "Serif"; color: var(--verde); margin-top: 30px; }
.pill { display: inline-block; margin-top: 80px; padding: 30px 54px; border-radius: 70px; background: var(--verde); color: var(--papel); font: 800 60px "Bricolage"; }
.web { margin-top: 30px; font: 600 34px "Mono"; color: var(--verde); }
.disco { position: absolute; width: 900px; height: 900px; border-radius: 50%; right: -260px; top: 900px; background: var(--oro); mix-blend-mode: multiply; opacity: 0; }
.disco::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background-image: radial-gradient(circle, rgba(29,74,53,.5) 34%, transparent 37%); background-size: 26px 26px; -webkit-mask-image: linear-gradient(200deg, #000, transparent 70%); transform: translate(-18px, 10px); }
#logo { position: absolute; bottom: 440px; left: 80px; width: 230px; opacity: 0; }
</style></head>
<body>
<div id="fondo"></div><div class="disco" id="disco"></div>
<div id="cab"><span>MITO VS. REALIDAD</span><span id="contador"></span></div>
<div class="panel" id="titulo"><div class="grande riso" id="t1"></div><div class="serif" id="t2"></div></div>
<div id="escena"><div id="carta">
  <div class="cara frente"><div class="semitono"></div><div class="num riso" id="fnum"></div>
    <div class="frase" id="ffrase"><div class="tacha" id="tacha"></div></div><div class="sello riso" id="fsello">MITO</div></div>
  <div class="cara dorso"><div class="semitono"></div><div class="num" id="dnum" style="color:var(--tinta)"></div>
    <div class="frase riso-oro" id="dfrase"></div><div class="sello" id="dsello" style="color:var(--papel);text-shadow:7px 5px 0 var(--verde)">REALIDAD</div></div>
</div></div>
<div class="panel" id="cierre"><div class="grande riso" id="c1"></div><div class="pill" id="wa"></div><div class="web">iftechworks.com</div></div>
<img id="logo" src="__LOGO_OSCURO__">
<script type="module">
import { fondo } from "__SHARED__/fondos.js";
const REEL = __DATOS__;
window.__ready = false;
const L = REEL.lineas;
const $ = (id) => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = (x) => 1 - Math.pow(1 - cl(x), 3);
const eio = (x) => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const fondoP = fondo($("fondo"), "grano", { back: "#f4eee2", colors: ["#f0c419", "#2f6b4c"], shape: "corners",
  softness: 0.7, intensity: 0.45, noise: 0.5, sizing: { scale: 1.3 } });
const lineaEn = (t) => { let k = 0; L.forEach((l, i) => { if (t >= l.inicio - 0.05) k = i; }); return k; };
const total = L.filter((l) => l.escena === "mito").length;

function dibujar(t) {
  const i = lineaEn(t), l = L[i], p = cl((t - l.inicio) / l.duracion), dt = t - l.inicio;
  const esCarta = l.escena === "mito" || l.escena === "realidad";
  fondoP.then((f) => f.frame(t * 1000 * 0.5));
  $("escena").style.opacity = esCarta ? 1 : 0;
  $("titulo").style.opacity = l.escena === "titulo" ? 1 : 0;
  $("cierre").style.opacity = l.escena === "cierre" ? 1 : 0;
  $("logo").style.opacity = l.escena === "cierre" ? 1 : 0;
  const nn = l.n || (L[i - 1] || {}).n;
  $("disco").style.opacity = (l.escena === "titulo" || l.escena === "cierre") ? 1 : 0;
  $("disco").style.transform = `translateY(${(1 - eo(dt / 0.8)) * 300}px)`;
  $("contador").textContent = esCarta && nn ? `${String(nn).padStart(2, "0")} / ${String(total).padStart(2, "0")}` : "";
  if (l.escena === "titulo") {
    $("t1").innerHTML = l.grande; $("t2").innerHTML = l.serif || "";
    $("t1").style.transform = `translateY(${(1 - eo(dt / 0.6)) * 80}px)`; $("t1").style.opacity = eo(dt / 0.4);
    $("t2").style.opacity = eo((dt - 0.5) / 0.5);
  }
  if (esCarta) {
    // Mito: la carta cae y se sella. Realidad: la misma carta se voltea.
    const mito = l.escena === "mito" ? l : L[i - 1], real = l.escena === "realidad" ? l : null;
    $("fnum").textContent = `MITO ${String(mito.n).padStart(2, "0")}`;
    $("ffrase").childNodes.forEach((n) => n.nodeType === 3 && n.remove());
    $("ffrase").insertAdjacentText("beforeend", mito.pantalla);
    if (real) { $("dnum").textContent = `REALIDAD ${String(mito.n).padStart(2, "0")}`; $("dfrase").textContent = real.pantalla; }
    let rot = 0, y = 0, s = 1;
    if (l.escena === "mito") { const k = eo(dt / 0.55); y = (1 - k) * -1400; rot = (1 - k) * -8; }
    const giro = real ? eio(dt / 0.6) * 180 : 0;
    s = real ? 1 - Math.sin(Math.PI * cl(dt / 0.6)) * 0.08 : 1;
    $("carta").style.transform = `translateY(${y}px) rotateZ(${rot}deg) rotateY(${giro}deg) scale(${s})`;
    // Sello MITO y tachón
    const ks = l.escena === "mito" ? cl((p - 0.3) / 0.12) : 1;
    $("fsello").style.transform = `scale(${1.6 - 0.6 * ks}) rotate(-6deg)`; $("fsello").style.opacity = ks;
    const tachaP = l.escena === "mito" ? cl((p - 0.7) / 0.2) : 1;
    // Tachón en diagonal sobre toda la frase
    const fr = $("ffrase"), W = fr.offsetWidth * 0.95, H = fr.offsetHeight, ang = Math.atan2(H * 0.7, W);
    $("tacha").style.top = (H * 0.15) + "px"; $("tacha").style.transform = `rotate(${ang}rad)`;
    $("tacha").style.width = (tachaP * (Math.hypot(W, H * 0.7) + 40)) + "px";
    const kd = real ? cl((dt - 0.6) / 0.25) : 0;
    $("dsello").style.transform = `scale(${1.5 - 0.5 * kd}) rotate(-4deg)`; $("dsello").style.opacity = kd;
  }
  if (l.escena === "cierre") {
    $("c1").innerHTML = l.grande; $("wa").textContent = REEL.whatsapp;
    $("c1").style.transform = `translateY(${(1 - eo(dt / 0.6)) * 80}px)`;
    $("wa").style.transform = `scale(${0.85 + 0.15 * eo((dt - 0.4) / 0.4)})`;
  }
}
await fondoP;
await document.fonts.ready;
window.__seek = async (t) => { dibujar(t); await fondoP; };
window.__ready = true;
</script>
</body></html>
