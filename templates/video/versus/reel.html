<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face { font-family: "SG"; src: url("__FONTS__/SpaceGrotesk.ttf"); font-weight: 300 700; }
@font-face { font-family: "Tight"; src: url("__FONTS__/InterTight.ttf"); font-weight: 100 900; }
@font-face { font-family: "Mono"; src: url("__FONTS__/JetBrainsMono.ttf"); }
@font-face { font-family: "Serif"; src: url("__FONTS__/InstrumentSerif-Italic.ttf"); }
/* Formato «A mano vs. agente»: misma situación en dos versiones (pantalla dividida) y un giro final donde la persona gana. */
:root { --bg: #0a1410; --sf: #162920; --sf2: #1d362b; --au: #f0c419; --tx: #fefcf3; --mu: #9ca3af; --rojo: #e57373; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--tx); font-family: "Tight"; }
#fondo { position: absolute; inset: 0; }
.half { position: absolute; left: 0; right: 0; height: 960px; padding: 120px 80px 0; box-sizing: border-box; overflow: hidden; }
#h1 { top: 0; background: #1a1a17; }
#h2 { top: 960px; }
.tag { display: inline-block; padding: 12px 24px; border-radius: 999px; font: 500 30px "Mono"; letter-spacing: 3px; }
#h1 .tag { background: #3a3a33; }
#h2 .tag { background: var(--au); color: var(--bg); }
.bub { display: inline-block; max-width: 820px; padding: 28px 36px; border-radius: 30px; background: var(--sf2); font-size: 52px; line-height: 1.2; }
.bub.me { background: #2b4a3a; }
.bub .h { font: 500 28px "Mono"; color: var(--mu); margin-left: 12px; }
.clock { font: 700 150px/1 "Mono"; margin: 50px 0 20px; }
.nota { font: 500 40px "Mono"; color: var(--mu); }
#vs { position: absolute; top: 890px; left: 470px; width: 140px; height: 140px; border-radius: 50%; background: var(--au); color: var(--bg);
  font: 700 60px "SG"; display: flex; align-items: center; justify-content: center; z-index: 3; }
#giro { position: absolute; inset: 0; background: var(--bg); }
#gtop { position: absolute; left: 80px; right: 80px; top: 130px; font: 500 30px "Mono"; letter-spacing: 3px; color: var(--au); text-transform: uppercase; }
#gtit { position: absolute; left: 80px; right: 80px; top: 300px; font: 400 190px/1 "Serif"; color: var(--au); }
#gcard { position: absolute; left: 80px; right: 80px; top: 640px; border-radius: 40px; background: var(--sf); padding: 56px; box-sizing: border-box; }
#gcard .tag { background: var(--au); color: var(--bg); margin: 40px 0 30px; }
#grem { position: absolute; left: 80px; right: 80px; top: 1470px; font: 700 96px/1.05 "SG"; letter-spacing: -2px; }
#grem em { font-style: normal; color: var(--au); }
#cierre { position: absolute; inset: 0; background: var(--bg); }
#cierre h1 { position: absolute; left: 80px; right: 60px; top: 640px; margin: 0; font: 700 104px/1.05 "SG"; letter-spacing: -3px; }
#cierre h1 em { font: 400 132px/1.1 "Serif"; color: var(--au); font-style: normal; }
#wa { position: absolute; left: 80px; top: 1120px; padding: 30px 44px; border-radius: 999px; background: var(--au); color: var(--bg); font: 700 54px "SG"; }
#logo { position: absolute; right: 80px; bottom: 90px; height: 80px; }
.fx { position: absolute; inset: 0; pointer-events: none; }
</style></head>
<body>
<div id="fondo"></div>
<div class="half" id="h1">
  <span class="tag">VERSIÓN 1 · A MANO</span>
  <div style="margin-top:60px"><div class="bub" id="q1"></div></div>
  <div class="clock" id="c1"></div>
  <div class="nota" id="n1"></div>
</div>
<div class="half" id="h2">
  <span class="tag">VERSIÓN 2 · AGENTE</span>
  <div style="margin-top:60px"><div class="bub" id="q2"></div></div>
  <div style="margin-top:24px"><div class="bub me" id="a2"></div></div>
  <div class="clock" id="c2" style="color:var(--au)"></div>
</div>
<div id="vs">VS</div>
<div id="giro">
  <div id="gtop"></div><div id="gtit"></div>
  <div id="gcard"><div class="bub" id="gm1"></div><br><span class="tag" id="gtag"></span><br><div class="bub me" id="gm2"></div></div>
  <div id="grem"></div>
</div>
<div id="cierre"><h1 id="ctit"></h1><div id="wa"></div><img id="logo" src="__LOGO__"></div>
<div class="fx" id="flash"></div>
<script type="module">
import { fondo } from "__SHARED__/fondos.js";
const REEL = __DATOS__;
window.__ready = false;
const L = REEL.lineas, $ = (id) => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const out = (x) => 1 - (1 - cl(x)) ** 3;
const pop = (x) => { x = cl(x); return x === 0 ? 0 : 1 + 2.2 * (x - 1) ** 3 + 1.2 * (x - 1) ** 2; };
const fondoP = fondo($("fondo"), "grano", { back: "#0a1410", colors: ["#1d362b", "#3a3412", "#0f1d17"], softness: 0.8, intensity: 0.25, noise: 0.18, shape: "corners" });
const lineaEn = (t) => { let k = 0; L.forEach((l, i) => { if (t >= l.inicio - 0.05) k = i; }); return k; };
const d0 = L[0], lm = L.find((l) => l.lado === "mano"), la = L.find((l) => l.lado === "agente");
const iM = L.indexOf(lm), iA = L.indexOf(la);
const giros = L.filter((l) => l.pantalla === "giro"), gTit = giros.find((l) => l.titulo), gMsg = giros.find((l) => l.mensajes);
const bub = (txt, h) => `${txt}<span class="h">${h}</span>`;
$("q1").innerHTML = bub(d0.pregunta, d0.hora); $("q2").innerHTML = bub(d0.pregunta, d0.hora);
$("a2").innerHTML = bub(la.respuesta, la.reloj);
$("n1").textContent = lm.nota || "";
$("gtop").textContent = gTit ? L[L.indexOf(gTit)].texto.split("?")[0] + "?" : "";
$("gtit").textContent = gTit?.titulo || "";
$("gm1").textContent = gMsg?.mensajes[0] || ""; $("gm2").textContent = gMsg?.mensajes[1] || "";
$("gtag").textContent = gMsg?.etiqueta || ""; $("grem").innerHTML = gMsg?.remate || "";
$("wa").textContent = "WhatsApp " + REEL.whatsapp;
const minutos = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const hhmm = (x) => { x = ((Math.round(x) % 1440) + 1440) % 1440; return String(Math.floor(x / 60)).padStart(2, "0") + ":" + String(x % 60).padStart(2, "0"); };

function dibujar(t) {
  const i = lineaEn(t), l = L[i], dt = t - l.inicio, p = cl(dt / l.duracion);
  fondoP.then((f) => f.frame(t * 1000));
  const doble = l.pantalla === "doble", giro = l.pantalla === "giro", cierre = l.pantalla === "cierre";
  ["h1", "h2", "vs"].forEach((id) => ($(id).style.display = doble ? "" : "none"));
  $("giro").style.display = giro ? "block" : "none";
  $("cierre").style.display = cierre ? "block" : "none";
  if (doble) {
    // Entrada: las dos mitades se abren desde el centro
    const e = i === 0 ? out(dt / 0.4) : 1;
    $("h1").style.transform = `translateY(${(1 - e) * -200}px)`; $("h2").style.transform = `translateY(${(1 - e) * 200}px)`;
    $("vs").style.transform = `scale(${i === 0 ? pop((dt - 0.3) / 0.35) : 1}) rotate(${Math.sin(t * 2) * 4}deg)`;
    const sq = i === 0 ? pop((dt - 0.5) / 0.3) : 1;
    $("q1").style.transform = `scale(${sq})`; $("q2").style.transform = `scale(${i === 0 ? pop((dt - 0.65) / 0.3) : 1})`;
    // Foco: la mitad activa brilla, la otra se apaga
    const foco = l.lado;
    $("h1").style.opacity = foco === "agente" ? 0.35 : 1; $("h2").style.opacity = foco === "mano" ? 0.35 : 1;
    // A mano: el reloj corre toda la noche
    const desde = minutos(d0.hora), hasta = minutos(lm.reloj) + 1440;
    if (i < iM) { $("c1").textContent = d0.hora; $("c1").style.color = "var(--tx)"; $("n1").style.opacity = 0; }
    else {
      const k = i === iM ? out((dt - 0.2) / 1.6) : 1;
      $("c1").textContent = hhmm(desde + (hasta - desde) * k);
      $("c1").style.color = k >= 1 ? "var(--rojo)" : "var(--tx)";
      $("n1").style.opacity = i === iM ? cl((p - 0.55) / 0.1) : 1;
    }
    // Agente: responde en el mismo minuto
    const ka = i < iA ? 0 : i === iA ? pop((dt - 0.6) / 0.35) : 1;
    $("a2").style.transform = `scale(${ka})`; $("a2").parentElement.style.display = i < iA ? "none" : "";
    $("c2").textContent = i < iA ? "" : la.reloj; $("c2").style.opacity = i === iA ? cl((dt - 0.9) / 0.3) : 1;
  }
  if (giro) {
    const primero = l === gTit;
    const a = out(dt / 0.5);
    $("gtop").style.opacity = 1;
    $("gtit").style.opacity = primero ? cl((p - 0.45) / 0.15) : 1;
    $("gtit").style.transform = `translateY(${primero ? (1 - out((p - 0.45) / 0.2)) * 60 : 0}px)`;
    const mostrar = l === gMsg;
    $("gcard").style.display = $("grem").style.display = mostrar ? "" : "none";
    if (mostrar) {
      $("gcard").style.opacity = a; $("gcard").style.transform = `translateY(${(1 - a) * 120}px)`;
      $("gm1").style.transform = `scale(${pop((dt - 0.3) / 0.3)})`;
      $("gtag").style.transform = `scale(${pop((p - 0.25) / 0.08)})`;
      $("gm2").style.transform = `scale(${pop((p - 0.38) / 0.08)})`;
      const r = out((p - 0.62) / 0.12); $("grem").style.opacity = r; $("grem").style.transform = `translateY(${(1 - r) * 50}px)`;
    }
  }
  if (cierre) {
    const a = out(dt / 0.45); $("ctit").innerHTML = l.titulo; $("ctit").style.opacity = a; $("ctit").style.transform = `translateY(${(1 - a) * 60}px)`;
    $("wa").style.transform = `scale(${pop((dt - 0.5) / 0.35)})`;
  }
  // Destello blanco en cada cambio de escena
  const fl = cl(1 - dt / 0.18) * (i > 0 && L[i - 1].pantalla !== l.pantalla ? 0.35 : 0);
  $("flash").style.background = `rgba(254,252,243,${fl})`;
}
await fondoP;
await document.fonts.ready;
window.__seek = async (t) => { dibujar(t); await fondoP; };
window.__ready = true;
</script>
</body></html>
