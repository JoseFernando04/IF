<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<!-- Formato «Lo que pediste vs. lo que te entregaron» (tendencia nov-2026): arma la expectativa, la rompe con un giro
     y cierra con cómo lo hace IF. Escenas:
     pedido (lista que se marca: items, marcar=n) | entrega (rótulo + caja que tiembla) | ventanas (n ventanas apiladas, texto)
     | manual (libro gordo, paginas) | clave (papelito con la contraseña) | reves (corte a marfil, frase) | final (la app sencilla con los items) | cierre -->
<style>
@font-face { font-family: "Bricolage"; src: url("__FONTS__/BricolageGrotesque.ttf"); font-weight: 200 800; }
@font-face { font-family: "Tight"; src: url("__FONTS__/InterTight.ttf"); font-weight: 100 900; }
@font-face { font-family: "SerifI"; src: url("__FONTS__/InstrumentSerif-Italic.ttf"); }
@font-face { font-family: "Mono"; src: url("__FONTS__/JetBrainsMono.ttf"); }
:root { --verde: #0a1410; --verde3: #1d362b; --oro: #f0c419; --marfil: #fefcf3; --rojo: #e2553f; --ok: #57b96f; --papel: #efe9d7; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--marfil); color: var(--verde); font-family: "Tight"; }
#fondo { position: absolute; inset: 0; }
/* Rótulo superior tipo meme: LO QUE PEDISTE / LO QUE TE ENTREGARON */
#rot { position: absolute; left: 70px; right: 70px; top: 190px; display: flex; align-items: center; gap: 24px; }
#rot b { padding: 16px 30px; border-radius: 14px; font: 800 54px "Bricolage"; letter-spacing: -1px; white-space: nowrap; }
#rot span { font: 600 26px "Mono"; letter-spacing: 3px; opacity: .6; }
/* Pedido: una boleta de pedido con lista */
#pedido { position: absolute; left: 110px; right: 110px; top: 420px; padding: 60px 64px 70px; background: #fff; border-radius: 26px; border: 3px solid #e2dccb;
  box-shadow: 0 30px 70px rgba(10,20,16,.12); transform-origin: 50% 0; }
#pedido .n { font: 600 28px "Mono"; letter-spacing: 3px; color: #6b726d; }
#pedido h2 { margin: 18px 0 40px; font: 800 86px/1 "Bricolage"; letter-spacing: -3px; }
#pedido h2 em { font: 400 100px "SerifI"; letter-spacing: 0; color: #1e6b41; }
.it { display: flex; align-items: center; gap: 30px; padding: 26px 0; border-top: 3px dashed #e2dccb; font: 600 52px "Tight"; }
.it i { flex: none; width: 70px; height: 70px; border-radius: 16px; border: 5px solid var(--verde); display: grid; place-items: center; font: 900 50px "Tight"; font-style: normal; color: var(--marfil); box-sizing: border-box; }
.it.on i { background: var(--ok); border-color: var(--ok); }
/* Entrega: una caja que tiembla */
#caja { position: absolute; left: 50%; top: 760px; width: 620px; height: 520px; margin-left: -310px; transform-origin: 50% 100%; }
#caja .cuerpo { position: absolute; left: 0; right: 0; bottom: 0; height: 400px; background: #c89b5e; border-radius: 10px; }
#caja .cuerpo::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 90px; margin-left: -45px; background: rgba(255,255,255,.35); }
#caja .tapa { position: absolute; left: -24px; right: -24px; top: 80px; height: 70px; background: #b5874b; border-radius: 8px; transform-origin: 0 100%; }
#caja .et { position: absolute; left: 40px; bottom: 50px; padding: 14px 20px; background: #fff; font: 700 26px/1.3 "Mono"; transform: rotate(-3deg); }
#caja .frag { position: absolute; right: 40px; bottom: 60px; font: 800 44px "Bricolage"; color: var(--rojo); border: 5px solid var(--rojo); padding: 6px 16px; transform: rotate(6deg); }
/* Ventanas que se apilan */
#ventanas { position: absolute; inset: 0; }
.w { position: absolute; width: 640px; height: 470px; border-radius: 20px; background: #fff; border: 3px solid #cfc8b3; box-shadow: 0 18px 40px rgba(10,20,16,.18); overflow: hidden; }
.w .b { height: 50px; background: #2a4237; display: flex; align-items: center; gap: 10px; padding: 0 18px; font: 600 22px "Mono"; color: #c5d3cb; }
.w .b i { width: 14px; height: 14px; border-radius: 50%; background: #e2553f; }
.w .c { padding: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.w .c span { height: 34px; border-radius: 6px; background: #ece6d4; }
.w .c span.k { background: #d6cfb9; grid-column: span 2; }
#cuenta { position: absolute; right: 70px; top: 1450px; text-align: right; }
#cuenta .num { font: 800 300px/0.85 "Bricolage"; letter-spacing: -14px; color: var(--rojo); }
#cuenta .txt { font: 700 54px "Tight"; }
/* Manual */
#manual { position: absolute; left: 50%; top: 600px; width: 560px; height: 760px; margin-left: -280px; transform-origin: 50% 100%; }
#manual .lomo { position: absolute; inset: 0; background: #1d362b; border-radius: 12px 26px 26px 12px; box-shadow: 0 50px 80px rgba(10,20,16,.35); }
#manual .hojas { position: absolute; right: -26px; top: 18px; bottom: 18px; width: 40px; background: repeating-linear-gradient(90deg, #fff 0 3px, #ddd6c2 3px 5px); border-radius: 0 10px 10px 0; }
#manual .tt { position: absolute; left: 60px; right: 50px; top: 90px; font: 800 70px/1 "Bricolage"; color: var(--marfil); letter-spacing: -2px; }
#manual .tt small { display: block; font: 600 26px "Mono"; color: var(--oro); letter-spacing: 4px; margin-bottom: 30px; }
#manual .vol { position: absolute; left: 60px; bottom: 70px; font: 600 30px "Mono"; color: #8fa49a; }
#paginas { position: absolute; left: 0; right: 0; top: 1470px; text-align: center; font: 800 110px "Bricolage"; letter-spacing: -4px; }
#paginas em { font: 400 120px "SerifI"; color: #1e6b41; letter-spacing: 0; }
/* Contraseña */
#nota { position: absolute; left: 50%; top: 650px; width: 680px; margin-left: -340px; padding: 70px 60px 80px; background: var(--oro); box-shadow: 0 30px 60px rgba(10,20,16,.25);
  font: 400 86px/1.05 "SerifI"; text-align: center; transform-origin: 50% 0; }
#nota small { display: block; font: 700 30px "Mono"; letter-spacing: 4px; margin-bottom: 30px; font-style: normal; }
#nota .cinta { position: absolute; left: 50%; top: -30px; width: 220px; height: 60px; margin-left: -110px; background: rgba(254,252,243,.65); transform: rotate(-3deg); }
/* Al revés: fondo verde, frase */
#reves { position: absolute; inset: 0; background: var(--verde); color: var(--marfil); }
#reves .f { position: absolute; left: 80px; right: 80px; top: 640px; font: 800 120px/0.98 "Bricolage"; letter-spacing: -4px; }
#reves .f em { font: 400 136px "SerifI"; color: var(--oro); letter-spacing: -1px; }
#reves img { position: absolute; left: 80px; top: 230px; width: 180px; }
/* Final: la app sencilla */
#final { position: absolute; inset: 0; }
#tel { position: absolute; left: 50%; top: 430px; width: 600px; height: 1080px; margin-left: -300px; border-radius: 70px; background: var(--verde); padding: 26px; box-sizing: border-box;
  box-shadow: 0 50px 100px rgba(10,20,16,.3); transform-origin: 50% 50%; }
#tel .pan { height: 100%; border-radius: 50px; background: var(--marfil); padding: 90px 40px 0; box-sizing: border-box; }
#tel .hola { font: 600 26px "Mono"; color: #6b726d; letter-spacing: 3px; }
#tel h3 { margin: 12px 0 50px; font: 800 64px/1 "Bricolage"; letter-spacing: -2px; }
.bt { display: flex; align-items: center; gap: 24px; padding: 34px 30px; margin-bottom: 26px; border-radius: 28px; background: #fff; border: 3px solid #e2dccb; font: 700 44px "Tight"; }
.bt i { flex: none; width: 64px; height: 64px; border-radius: 18px; background: var(--oro); font-style: normal; display: grid; place-items: center; font: 800 34px "Mono"; }
#solo { position: absolute; left: 0; right: 0; top: 1570px; text-align: center; font: 800 96px "Bricolage"; letter-spacing: -3px; }
#solo em { font: 400 110px "SerifI"; color: #1e6b41; letter-spacing: 0; }
/* Cierre */
#cierre { position: absolute; inset: 0; background: var(--verde); color: var(--marfil); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
#cierre img { width: 260px; margin-bottom: 80px; }
#cierre .frase { font: 800 108px/1.0 "Bricolage"; letter-spacing: -3px; padding: 0 80px; }
#cierre .frase em { font: 400 124px "SerifI"; color: var(--oro); letter-spacing: 0; }
#cierre .wa { margin-top: 70px; padding: 26px 50px; border-radius: 60px; background: var(--oro); color: var(--verde); font: 800 54px "Bricolage"; }
#pie { position: absolute; left: 0; right: 0; top: 1470px; text-align: center; font: 800 110px/1 "Bricolage"; letter-spacing: -4px; }
#pie em { font: 400 124px "SerifI"; color: var(--rojo); letter-spacing: 0; }
#flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
</style></head>
<body>
<div id="fondo"></div>
<div id="pedido"><div class="n" id="pedN"></div><h2 id="pedT"></h2><div id="items"></div></div>
<div id="caja"><div class="cuerpo"></div><div class="tapa"></div><div class="et">PARA: TU NEGOCIO<br>CONTIENE: «SISTEMA»</div><div class="frag">FRÁGIL</div></div>
<div id="ventanas"></div>
<div id="cuenta"><div class="num"></div><div class="txt"></div></div>
<div id="manual"><div class="hojas"></div><div class="lomo"></div><div class="tt"><small>MANUAL DE USUARIO</small>Cómo hacer<br>una venta</div><div class="vol">Tomo 1 de 3</div></div>
<div id="paginas"></div>
<div id="nota"><div class="cinta"></div><small>CONTRASEÑA</small><span></span></div>
<div id="reves"><img src="__LOGO__"><div class="f"></div></div>
<div id="final"><div id="tel"><div class="pan"><div class="hola">BUENOS DÍAS</div><h3>Tu negocio</h3><div id="bts"></div></div></div><div id="solo"></div></div>
<div id="cierre"><img src="__LOGO__"><div class="frase"></div><div class="wa"></div></div>
<div id="pie"></div>
<div id="rot"><b></b><span></span></div>
<div id="flash"></div>
<script type="module">
import { fondo } from "__SHARED__/fondos.js";
const R = __DATOS__;
window.__ready = false;
const L = R.lineas, $ = (id) => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = (x) => 1 - Math.pow(1 - cl(x), 3);
const eb = (x) => { x = cl(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const em = (s) => (s || "").replace(/\s*\/\s*/g, "<br>").replace(/\*([^*]+)\*/g, "<em>$1</em>");
const fondoP = fondo($("fondo"), "puntos", { back: "#fefcf3", fill: "#d9d2bd", size: 3, gap: 48 });
const lineaEn = (t) => { let k = 0; L.forEach((l, i) => { if (t >= l.inicio - 0.05) k = i; }); return k; };
const items = R.items || [];
$("pedN").textContent = R.pedido_n || "PEDIDO #001";
$("pedT").innerHTML = em(R.pedido_t || "Un sistema / *sencillo*");
$("items").innerHTML = items.map((x) => `<div class="it"><i>✓</i><span>${x}</span></div>`).join("");
$("bts").innerHTML = items.map((x, k) => `<div class="bt"><i>${k + 1}</i><span>${x}</span></div>`).join("");
$("cierre").querySelector(".wa").textContent = R.whatsapp;
// Ventanas: posiciones fijas (sin azar) en cascada desordenada.
const NV = 14;
$("ventanas").innerHTML = Array.from({ length: NV }, (_, k) => {
  const x = 40 + ((k * 137) % 380), y = 380 + ((k * 89) % 820), r = ((k * 7) % 11) - 5;
  return `<div class="w" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)"><div class="b"><i></i>Pantalla ${k + 1} de ${NV}</div><div class="c">${"<span></span><span class='k'></span>".repeat(5)}</div></div>`;
}).join("");
const ws = [...$("ventanas").children];
const ESCENAS = ["pedido", "entrega", "ventanas", "manual", "clave", "reves", "final", "cierre"];
function dibujar(t) {
  fondoP.then((f) => f.frame(t * 1000));
  const i = lineaEn(t), l = L[i], dt = Math.max(0, t - l.inicio), esc = l.escena;
  const vis = { pedido: $("pedido"), entrega: $("caja"), ventanas: $("ventanas"), manual: $("manual"), clave: $("nota"), reves: $("reves"), final: $("final"), cierre: $("cierre") };
  ESCENAS.forEach((e) => vis[e].style.display = e === esc ? "block" : "none");
  if (esc === "cierre") vis.cierre.style.display = "flex";
  $("cuenta").style.display = esc === "ventanas" ? "block" : "none";
  $("paginas").style.display = esc === "manual" ? "block" : "none";
  // Rótulo: verde «LO QUE PEDISTE» antes del giro; rojo «LO QUE TE ENTREGARON» después.
  const antes = esc === "pedido", despues = ["entrega", "ventanas", "manual", "clave"].includes(esc);
  $("rot").style.display = antes || despues ? "flex" : "none";
  const rb = $("rot").querySelector("b");
  rb.textContent = antes ? "LO QUE PEDISTE" : "LO QUE TE ENTREGARON";
  rb.style.background = antes ? "var(--ok)" : "var(--rojo)"; rb.style.color = antes ? "var(--verde)" : "var(--marfil)";
  $("rot").querySelector("span").textContent = antes ? "" : "";
  const primeraDe = (e) => L.findIndex((x) => x.escena === e) === i;
  if (antes && primeraDe("pedido")) $("rot").style.transform = `translateX(${(1 - eb(dt / 0.4)) * -80}px)`; else $("rot").style.transform = "";
  if (esc === "entrega") { const k = eb(dt / 0.3); rb.style.transform = `scale(${0.6 + 0.4 * k}) rotate(${(1 - k) * -6}deg)`; } else rb.style.transform = "";
  if (esc === "pedido") {
    const k = primeraDe("pedido") ? eb(dt / 0.5) : 1;
    $("pedido").style.transform = `translateY(${(1 - k) * 120}px)`; $("pedido").style.opacity = primeraDe("pedido") ? cl(dt / 0.25) : 1;
    // Los items se marcan uno por uno durante la línea con «marcar»
    const its = [...$("items").children];
    its.forEach((el, j) => {
      const on = l.marcar ? dt > l.duracion * (0.15 + 0.25 * j) : false;
      el.className = "it" + (on ? " on" : "");
      el.style.opacity = l.marcar || primeraDe("pedido") === false ? 1 : cl((dt - 0.4 - j * 0.2) / 0.2);
    });
  }
  if (esc === "entrega") {
    const temb = dt > 0.4 ? Math.sin(dt * 55) * 4 * cl((dt - 0.4) / 0.3) : 0;
    const k = eb(dt / 0.45);
    $("caja").style.transform = `translateY(${(1 - k) * -300}px) rotate(${temb * 0.6}deg)`;
    $("caja").querySelector(".tapa").style.transform = `rotate(${-Math.max(0, (dt - l.duracion * 0.6)) * 40}deg)`;
  }
  if (esc === "ventanas") {
    const n = Math.min(NV, Math.floor(1 + eo(dt / (l.duracion * 0.85)) * NV));
    ws.forEach((w, k) => { w.style.display = k < n ? "block" : "none"; });
    $("cuenta").querySelector(".num").textContent = n;
    $("cuenta").querySelector(".txt").innerHTML = em(l.cuenta || "pantallas / para una venta");
  }
  if (esc === "manual") {
    const k = cl(dt / 0.35), cae = 1 - Math.pow(1 - k, 2);
    const reb = dt > 0.35 ? Math.max(0, 1 - (dt - 0.35) / 0.2) : 0;
    $("manual").style.transform = `translateY(${(1 - cae) * -900}px) scaleY(${1 - reb * 0.06}) scaleX(${1 + reb * 0.04})`;
    const p = Math.round(eo((dt - 0.4) / (l.duracion * 0.6)) * (l.paginas || 80));
    $("paginas").innerHTML = `${Math.max(1, p)} <em>páginas</em>`;
  }
  if (esc === "clave") {
    const k = eb(dt / 0.45);
    $("nota").querySelector("span").innerHTML = em(l.nota);
    $("nota").style.transform = `rotate(${-3 + (1 - k) * 12}deg) scale(${0.7 + 0.3 * k})`; $("nota").style.opacity = cl(dt / 0.15);
  }
  if (esc === "reves") {
    $("reves").querySelector(".f").innerHTML = em(l.frase);
    const k = eo(dt / 0.4); $("reves").querySelector(".f").style.transform = `translateY(${(1 - k) * 50}px)`;
    $("reves").querySelector(".f").style.opacity = k;
  }
  if (esc === "final") {
    const k = eb(dt / 0.5); $("tel").style.transform = `translateY(${(1 - k) * 200}px) scale(${0.92 + 0.08 * k})`;
    [...$("bts").children].forEach((b, j) => { const kb = eb((dt - 0.35 - j * 0.22) / 0.35); b.style.opacity = cl((dt - 0.35 - j * 0.22) / 0.15);
      b.style.transform = `translateX(${(1 - kb) * 60}px)`; });
    $("solo").innerHTML = em(l.solo); $("solo").style.opacity = cl((dt - l.duracion * 0.5) / 0.2);
  }
  if (esc === "cierre") { $("cierre").querySelector(".frase").innerHTML = em(l.frase); $("cierre").style.opacity = eo(dt / 0.3); }
  $("pie").style.display = l.pie ? "block" : "none";
  if (l.pie) { $("pie").innerHTML = em(l.pie); const kp = eo((dt - 0.5) / 0.35); $("pie").style.opacity = kp; $("pie").style.transform = `translateY(${(1 - kp) * 30}px)`; }
  $("flash").style.opacity = l.golpe ? 0.95 * (1 - cl(dt / 0.2)) : 0;
}
await fondoP;
await document.fonts.ready;
window.__seek = async (t) => { dibujar(t); await fondoP; };
window.__ready = true;
</script>
</body></html>
