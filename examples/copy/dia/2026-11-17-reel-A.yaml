# Reel A · «Nombrá el problema» (formato NUEVO `concepto`, tendencia «nombrá el concepto»). Pilar: educativo. Serie repetible.
# Se le pone un nombre memorable a un dolor: el síndrome del archivo final. La voz lee los nombres de archivo (sin siglas).
