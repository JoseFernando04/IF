caption: >-
  Los likes son lo que se ve. Lo que no se ve es la persona que revisó tu perfil a las diez de la noche y al día siguiente te escribió. 👀📱
  Publicar no es para la foto bonita: es para que quien te busca vea un negocio vivo, sepa qué vendés y llegue con menos dudas.
  ¿Te pasa que publicás y sentís que nadie lo ve? Contanos 👇 Y si no tenés tiempo de hacerlo, escribinos al WhatsApp +502 3808 9808.
