caption: >-
  Un pedido que entra por WhatsApp no debería depender de que alguien se acuerde de anotarlo. 📲📦
  Así se ve, en tres pasos, el camino de un pedido en una distribuidora ordenada: sin copiar a mano, sin perder mensajes y con el cliente enterado.
  Guardala para cuando estés pensando en ordenar tus pedidos. ¿Querés verlo funcionando? Escribinos al WhatsApp +502 3808 9808.
