caption: >-
  Nadie puso un negocio porque le encantaba cobrar. 🫠💸
  Y casi siempre, el que debe no es mala paga: se le fue la fecha. Un recordatorio amable unos días antes resuelve más que tres llamadas incómodas después.
  ¿Quién hace los cobros en tu negocio: vos, o «cuando haya tiempo»? Contanos 👇
  Si querés que los recordatorios salgan solos por WhatsApp, escribinos al +502 3808 9808. (Escena de ejemplo.)
