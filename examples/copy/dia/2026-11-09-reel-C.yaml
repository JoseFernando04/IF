lineas:
  - texto: Antes de escribir una sola línea de código, nos sentamos a ver cómo trabaja tu negocio.
    tema: verde
    palabras: "Primero, / *escuchamos.*"
    sfx: [[0.05, whoosh]]
  - texto: Empezamos por lo que más te duele, no por lo más caro.
    tema: marfil
    palabras: "Lo que *duele* / va primero."
    sfx: [[0.05, whoosh], [0.55, pop]]
  - texto: Vos ves cada avance, y nada se entrega sin tu visto bueno.
    tema: oro
    palabras: "Vos / *decidís.*"
    sub: "CADA AVANCE · TU VISTO BUENO"
    sfx: [[0.05, whoosh], [0.6, pop]]
  - texto: Y no te dejamos solo. Le enseñamos a tu equipo a usarlo.
    tema: verde
    palabras: "Tu equipo / *lo domina.*"
    sfx: [[0.05, tick], [0.5, tick]]
  - texto: Tecnología a la medida de tu negocio, no al revés.
    tema: marfil
    palabras: "A tu / *medida.*"
    sfx: [[0.05, whoosh]]
  - texto: Contanos qué es lo que más tiempo te quita.
    tema: verde
    escena: cierre
    palabras: "¿Qué te quita / *más tiempo?*"
    sfx: [[0.05, whoosh], [0.6, pop]]
